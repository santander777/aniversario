<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 meses contigo, Naomy 💙</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<canvas id="petalos"></canvas>

<header class="portada" id="portada">
  <div class="portada-txt">
    <p class="sub">Nuestro aniversario</p>
    <h1>2 meses juntos</h1>
    <p class="para">Para ti, Naomy ✨</p>
    <p class="reloj" id="reloj"></p>
    <button class="boton" id="entrar">Entrar</button>
  </div>
</header>

<main class="fotos" id="fotos">
  <div class="barra">
    <button class="boton chico" id="volver">← Volver</button>
    <h2>Nuestros recuerdos</h2>
    <p class="nota">Toca una foto para ver lo que te escribí 💙</p>
  </div>
  <div class="galeria" id="grid"></div>
</main>

<div class="visor" id="visor">
  <div class="caja" id="caja">
    <button class="cerrar" id="cerrar">✕</button>
    <div id="medio"></div>
    <p id="texto"></p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
